<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice by Rutvik Gawali</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        header {
            text-align: center;
            margin-bottom: 15px;
        }
        header h1 {
            margin: 0;
            color: #0284c7;
            font-size: 1.6rem;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e2e8f0;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .toolbar select {
            padding: 5px 10px;
            font-size: 1rem;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }
        .stats-box {
            display: flex;
            gap: 15px;
        }
        /* Vertical Split: Left Passage, Right Typing */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .pane {
            display: flex;
            flex-direction: column;
        }
        .pane label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #475569;
        }
        .text-box {
            height: 220px;
            padding: 12px;
            font-size: 1.1rem;
            line-height: 1.6;
            border: 1px solid #94a3b8;
            border-radius: 5px;
            background: #fafafa;
            overflow-y: auto;
            resize: none;
            font-family: inherit;
        }
        #answer-box:focus {
            outline: none;
            border-color: #0284c7;
            background: #fff;
        }
        .char-correct {
            color: #16a34a;
        }
        .char-incorrect {
            color: #dc2626;
            background-color: #fee2e2;
        }
        .controls {
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-reset {
            background-color: #64748b;
        }
        /* Result Popup */
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h2 {
            color: #0284c7;
            margin-top: 0;
        }
        footer {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Typing Practice by Rutvik Gawali</h1>
        </header>

        <div class="toolbar">
            <div>
                <label for="passage-select">Select Passage: </label>
                <select id="passage-select" onchange="changePassage()">
                    <option value="0">English 30 WPM - Passage 1</option>
                    <option value="1">English 40 WPM - Passage 2</option>
                    <option value="2">General Practice - Passage 3</option>
                </select>
            </div>
            <div class="stats-box">
                <div>Time: <span id="time-tag">60</span>s</div>
                <div>WPM: <span id="wpm-tag">0</span></div>
                <div>Accuracy: <span id="acc-tag">100</span>%</div>
            </div>
        </div>

        <div class="workspace">
            <!-- Left Pane: Question Passage -->
            <div class="pane">
                <label>Question Passage</label>
                <div id="question-box" class="text-box"></div>
            </div>

            <!-- Right Pane: Typing Area -->
            <div class="pane">
                <label>Type Here</label>
                <textarea id="answer-box" class="text-box" placeholder="Start typing here..." autofocus></textarea>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="submitTest()">Submit Test</button>
            <button class="btn btn-reset" onclick="resetTest()">Reset</button>
        </div>
    </div>

    <!-- Result Popup -->
    <div id="result-modal">
        <div class="modal-content">
            <h2>Test Result</h2>
            <p style="font-size: 1.2rem;"><strong>Marks:</strong> <span id="res-marks">0</span> / 40</p>
            <p><strong>Speed:</strong> <span id="res-wpm">0</span> WPM</p>
            <p><strong>Accuracy:</strong> <span id="res-acc">0</span>%</p>
            <button class="btn" onclick="closeModal()" style="margin-top: 10px;">Try Again</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Typing Practice by Rutvik Gawali. All rights reserved.</p>
    </footer>

    <script>
        const passages = [
            "Practice makes a man perfect. Regular typing practice helps you to increase your typing speed and accuracy significantly. Keep your fingers on the home row keys and focus on precision before speed in your daily routine.",
            "Technology is evolving rapidly every single day. Learning how to type fast and efficiently is an essential skill in the modern digital world, whether you are coding, writing reports, or communicating online effectively.",
            "Consistency is the key to mastering any new skill. Dedicate a few minutes everyday to practice typing without looking at the keyboard, and you will notice a massive improvement in your overall performance."
        ];

        let currentIdx = 0;
        const qBox = document.getElementById("question-box");
        const aBox = document.getElementById("answer-box");
        const timeTag = document.getElementById("time-tag");
        const wpmTag = document.getElementById("wpm-tag");
        const accTag = document.getElementById("acc-tag");
        const modal = document.getElementById("result-modal");

        let maxTime = 60;
        let timeLeft = maxTime;
        let timer = null;
        let isStarted = false;

        function loadPassage() {
            qBox.innerHTML = "";
            let text = passages[currentIdx];
            text.split("").forEach(char => {
                let span = document.createElement("span");
                span.innerText = char;
                qBox.appendChild(span);
            });
        }

        function changePassage() {
            currentIdx = parseInt(document.getElementById("passage-select").value);
            resetTest();
        }

        function resetTest() {
            clearInterval(timer);
            timeLeft = maxTime;
            isStarted = false;
            timeTag.innerText = timeLeft;
            wpmTag.innerText = "0";
            accTag.innerText = "100";
            aBox.value = "";
            aBox.disabled = false;
            modal.style.display = "none";
            loadPassage();
        }

        aBox.addEventListener("input", () => {
            if (!isStarted) {
                timer = setInterval(updateTimer, 1000);
                isStarted = true;
            }

            let spans = qBox.querySelectorAll("span");
            let typedVal = aBox.value;
            let typedChars = typedVal.split("");
            let errors = 0;

            spans.forEach((span, i) => {
                let char = typedChars[i];
                if (char == null) {
                    span.className = "";
                } else if (char === span.innerText) {
                    span.className = "char-correct";
                } else {
                    span.className = "char-incorrect";
                    errors++;
                }
            });

            let charIndex = typedChars.length;
            let correctChars = charIndex - errors;
            let timeElapsed = maxTime - timeLeft;

            let wpm = 0;
            if (timeElapsed > 0) {
                wpm = Math.round(((correctChars / 5) / (timeElapsed / 60)));
            }
            wpmTag.innerText = wpm < 0 ? 0 : wpm;

            let accuracy = 100;
            if (charIndex > 0) {
                accuracy = Math.round(((charIndex - errors) / charIndex) * 100);
            }
            accTag.innerText = accuracy < 0 ? 0 : accuracy;

            if (charIndex >= spans.length) {
                submitTest();
            }
        });

        function updateTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                timeTag.innerText = timeLeft;
            } else {
                submitTest();
            }
        }

        function submitTest() {
            clearInterval(timer);
            aBox.disabled = true;

            let finalWpm = parseInt(wpmTag.innerText) || 0;
            let finalAcc = parseInt(accTag.innerText) || 100;

            // Calculate marks out of 40
            let marks = Math.round((finalAcc / 100) * 40);
            if (marks > 40) marks = 40;

            document.getElementById("res-marks").innerText = marks;
            document.getElementById("res-wpm").innerText = finalWpm;
            document.getElementById("res-acc").innerText = finalAcc;

            modal.style.display = "flex";
        }

        function closeModal() {
            modal.style.display = "none";
            resetTest();
        }

        loadPassage();
    </script>
</body>
</html>
