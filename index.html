<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice with Rutvik Gawali</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --border-color: #cbd5e1;
            --error-bg: #ffe4e6;
            --error-color: #e11d48;
            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 5px 0;
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Vertical Split Layout: Left Question, Right Answer */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .pane {
            display: flex;
            flex-direction: column;
        }

        .pane label {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .box {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        #question-box {
            user-select: none;
            background: #fafafa;
        }

        #answer-box {
            width: 100%;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        #answer-box:focus {
            border-color: var(--accent-color);
        }

        .question-char.correct {
            color: var(--success-color);
        }

        .question-char.incorrect {
            color: var(--error-color);
            background-color: var(--error-bg);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: auto;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Typing Practice with Rutvik Gawali</h1>
            <p>GCCTBC Pattern Vertical Practice Layout</p>
        </header>

        <div class="stats-bar">
            <div>Time Left: <span id="time">60</span>s</div>
            <div>WPM: <span id="wpm">0</span></div>
            <div>Accuracy: <span id="accuracy">100</span>%</div>
        </div>

        <div class="workspace">
            <!-- Left Side: Question Text -->
            <div class="pane">
                <label>Question Passage</label>
                <div class="box" id="question-box"></div>
            </div>

            <!-- Right Side: Answer Typing Area -->
            <div class="pane">
                <label>Type Here</label>
                <textarea class="box" id="answer-box" placeholder="Start typing here..." autofocus></textarea>
            </div>
        </div>

        <div class="controls">
            <button onclick="resetTest()">Reset / Try Again</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Typing Practice with Rutvik Gawali. All rights reserved.</p>
    </footer>

    <script>
        const sampleText = "Practice makes a man perfect. Regular typing practice helps you to increase your typing speed and accuracy significantly. Keep your fingers on the home row keys and focus on precision before speed in your daily routine.";

        const questionBox = document.getElementById("question-box");
        const answerBox = document.getElementById("answer-box");
        const timeTag = document.getElementById("time");
        const wpmTag = document.getElementById("wpm");
        const accuracyTag = document.getElementById("accuracy");

        let maxTime = 60;
        let timeLeft = maxTime;
        let timer = null;
        let isTyping = false;

        function loadText() {
            questionBox.innerHTML = "";
            sampleText.split("").forEach(char => {
                let span = document.createElement("span");
                span.innerText = char;
                span.classList.add("question-char");
                questionBox.appendChild(span);
            });
        }

        function resetTest() {
            clearInterval(timer);
            timeLeft = maxTime;
            isTyping = false;
            timeTag.innerText = timeLeft;
            wpmTag.innerText = 0;
            accuracyTag.innerText = 100;
            answerBox.value = "";
            answerBox.disabled = false;
            loadText();
        }

        answerBox.addEventListener("input", () => {
            const characters = questionBox.querySelectorAll(".question-char");
            const typedValue = answerBox.value;
            const typedChars = typedValue.split("");

            if (!isTyping) {
                timer = setInterval(initTimer, 1000);
                isTyping = true;
            }

            let errors = 0;

            characters.forEach((charSpan, index) => {
                let typedChar = typedChars[index];
                if (typedChar == null) {
                    charSpan.classList.remove("correct", "incorrect");
                } else if (typedChar === charSpan.innerText) {
                    charSpan.classList.add("correct");
                    charSpan.classList.remove("incorrect");
                } else {
                    charSpan.classList.add("incorrect");
                    charSpan.classList.remove("correct");
                    errors++;
                }
            });

            // Calculate WPM and Accuracy
            let charIndex = typedChars.length;
            let correctChars = charIndex - errors;
            let timeElapsed = maxTime - timeLeft;

            let wpm = 0;
            if (timeElapsed > 0) {
                wpm = Math.round(((correctChars / 5) / (timeElapsed / 60)));
            }
            wpmTag.innerText = wpm < 0 || isNaN(wpm) ? 0 : wpm;

            let accuracy = 100;
            if (charIndex > 0) {
                accuracy = Math.round(((charIndex - errors) / charIndex) * 100);
            }
            accuracyTag.innerText = accuracy < 0 ? 0 : accuracy;

            // Stop if finished text
            if (charIndex >= characters.length) {
                clearInterval(timer);
                answerBox.disabled = true;
            }
        });

        function initTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                timeTag.innerText = timeLeft;
            } else {
                clearInterval(timer);
                answerBox.disabled = true;
            }
        }

        loadText();
    </script>
</body>
</html>
