<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice by Rutvik Gawali</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --border-color: #cbd5e1;
            --error-bg: #ffe4e6;
            --error-color: #e11d48;
            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        header h1 {
            margin: 0 0 5px 0;
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar select {
            padding: 8px 12px;
            font-size: 0.95rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            outline: none;
            background: #fff;
            color: var(--text-color);
            cursor: pointer;
        }

        .stats-group {
            display: flex;
            gap: 20px;
            font-weight: 600;
        }

        /* Vertical Split Layout: Left Question, Right Answer */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .pane {
            display: flex;
            flex-direction: column;
        }

        .pane label {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .box {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            height: 220px;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        #question-box {
            user-select: none;
            background: #fafafa;
        }

        #answer-box {
            width: 100%;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        #answer-box:focus {
            border-color: var(--accent-color);
        }

        .question-char.correct {
            color: var(--success-color);
        }

        .question-char.incorrect {
            color: var(--error-color);
            background-color: var(--error-bg);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Result Modal */
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .modal-content p {
            font-size: 1.1rem;
            margin: 10px 0;
        }

        footer {
            margin-top: auto;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Typing Practice by Rutvik Gawali</h1>
            <p>GCCTBC Pattern Practice Platform</p>
        </header>

        <div class="toolbar">
            <div>
                <label for="subject-select" style="font-weight: bold; margin-right: 8px;">Select Passage:</label>
                <select id="subject-select" onchange="changeSubject()">
                    <option value="0">English 30 WPM - Passage 1</option>
                    <option value="1">English 40 WPM - Passage 2</option>
                    <option value="2">Marathi / General - Passage 3</option>
                </select>
            </div>
            <div class="stats-group">
                <div>Time: <span id="time">60</span>s</div>
                <div>WPM: <span id="wpm">0</span></div>
                <div>Accuracy: <span id="accuracy">100</span>%</div>
            </div>
        </div>

        <div class="workspace">
            <!-- Left Side: Question Text -->
            <div class="pane">
                <label>Question Passage</label>
                <div class="box" id="question-box"></div>
            </div>

            <!-- Right Side: Answer Typing Area -->
            <div class="pane">
                <label>Type Here</label>
                <textarea class="box" id="answer-box" placeholder="Start typing here..." autofocus></textarea>
            </div>
        </div>

        <div class="controls">
            <button onclick="submitTest()">Submit Test</button>
            <button onclick="resetTest()" style="background-color: #64748b;">Reset</button>
        </div>
    </div>

    <!-- Result Popup Modal -->
    <div id="result-modal">
        <div class="modal-content">
            <h2>Test Completed!</h2>
            <p><strong>Marks:</strong> <span id="res-marks">0</span> / 40</p>
            <p><strong>Speed:</strong> <span id="res-wpm">0</span> WPM</p>
            <p><strong>Accuracy:</strong> <span id="res-acc">0</span>%</p>
            <button onclick="closeModal()" style="margin-top: 15px;">Try Again</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Typing Practice by Rutvik Gawali. All rights reserved.</p>
    </footer>

    <script>
        const passages = [
            "Practice makes a man perfect. Regular typing practice helps you to increase your typing speed and accuracy significantly. Keep your fingers on the home row keys and focus on precision before speed in your daily routine.",
            "Technology is evolving rapidly every single day. Learning how to type fast and efficiently is an essential skill in the modern digital world, whether you are coding, writing reports, or communicating online effectively.",
            "Consistency is the key to mastering any new skill. Dedicate a few minutes everyday to practice typing without looking at the keyboard, and you will notice a massive improvement in your overall performance."
        ];

        let currentPassageIndex = 0;
        const questionBox = document.getElementById("question-box");
        const answerBox = document.getElementById("answer-box");
        const timeTag = document.getElementById("time");
        const wpmTag = document.getElementById("wpm");
        const accuracyTag = document.getElementById("accuracy");
        const resultModal = document.getElementById("result-modal");
        
        let maxTime = 60;
        let timeLeft = maxTime;
        let timer = null;
        let isTyping = false;

        function loadText() {
            questionBox.innerHTML = "";
            let text = passages[currentPassageIndex];
            text.split("").forEach(char => {
                let span = document.createElement("span");
                span.innerText = char;
                span.classList.add("question-char");
                questionBox.appendChild(span);
            });
        }

        function changeSubject() {
            const select = document.getElementById("subject-select");
            currentPassageIndex = parseInt(select.value);
            resetTest();
        }

        function resetTest() {
            clearInterval(timer);
            timeLeft = maxTime;
            isTyping = false;
            timeTag.innerText = timeLeft;
            wpmTag.innerText = 0;
            accuracyTag.innerText = 100;
            answerBox.value = "";
            answerBox.disabled = false;
            resultModal.style.display = "none";
            loadText();
        }

        answerBox.addEventListener("input", () => {
            const characters = questionBox.querySelectorAll(".question-char");
            const typedValue = answerBox.value;
            const typedChars = typedValue.split("");

            if (!isTyping) {
                timer = setInterval(initTimer, 1000);
                isTyping = true;
            }

            let errors = 0;
            characters.forEach((charSpan, index) => {
                let typedChar = typedChars[index];
                if (typedChar == null) {
                    charSpan.classList.remove("correct", "incorrect");
                } else if (typedChar === charSpan.innerText) {
                    charSpan.classList.add("correct");
                    charSpan.classList.remove("incorrect");
                } else {
                    charSpan.classList.add("incorrect");
                    charSpan.classList.remove("correct");
                    errors++;
                }
            });

            let charIndex = typedChars.length;
            let correctChars = charIndex - errors;
            let timeElapsed = maxTime - timeLeft;

            let wpm = 0;
            if (timeElapsed > 0) {
                wpm = Math.round(((correctChars / 5) / (timeElapsed / 60)));
            }
            wpmTag.innerText = wpm < 0 || isNaN(wpm) ? 0 : wpm;

            let accuracy = 100;
            if (charIndex > 0) {
                accuracy = Math.round(((charIndex - errors) / charIndex) * 100);
            }
            accuracyTag.innerText = accuracy < 0 ? 0 : accuracy;

            if (charIndex >= characters.length) {
                submitTest();
            }
        });

        function initTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                timeTag.innerText = timeLeft;
            } else {
                submitTest();
            }
        }

        function submitTest() {
            clearInterval(timer);
            answerBox.disabled = true;

            let finalWpm = parseInt(wpmTag.innerText) || 0;
            let finalAcc = parseInt(accuracyTag.innerText) || 100;
            
            let calculatedMarks = Math.round((finalAcc / 100) * 40);
            if (calculatedMarks > 40) calculatedMarks = 40;

            document.getElementById("res-marks").innerText = calculatedMarks;
            document.getElementById("res-wpm").innerText = finalWpm;
            document.getElementById("res-acc").innerText = finalAcc;

            resultModal.style.display = "flex";
        }

        function closeModal() {
            resultModal.style.display = "none";
            resetTest();
        }

        loadText();
    </script>
</body>
</html>
